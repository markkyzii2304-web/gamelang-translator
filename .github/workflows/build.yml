name: Build GameLang Installer

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # กด build ด้วยตัวเองได้จาก Actions tab

permissions:
  contents: write   # required for creating GitHub Releases

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest  # ใช้ Windows VM จริง

    steps:
      # ── 1. Checkout โค้ด ───────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Read version ────────────────────────────────────────────────────
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "Version: $ver"

      # ── 3. ติดตั้ง Python ──────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 4. ติดตั้ง dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      # ── 5. สร้าง icon ─────────────────────────────────────────────────────
      - name: Create app icon
        shell: python
        run: |
          from PIL import Image, ImageDraw
          import os
          os.makedirs("assets", exist_ok=True)
          img = Image.new("RGBA", (256, 256), (9, 9, 18, 255))
          d = ImageDraw.Draw(img)
          for i in range(256):
              alpha = int(255 * (1 - i/256) * 0.3)
              d.line([(0,i),(255,i)], fill=(107, 158, 255, alpha))
          d.rounded_rectangle([20,20,236,236], radius=32,
                               fill=(20,20,50,255),
                               outline=(107,158,255,255), width=4)
          d.text((72, 52), "G", fill=(107,158,255,255))
          d.text((30, 160), "Lang", fill=(200,210,255,200))
          img.save("assets/icon.ico", format="ICO",
                   sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])
          print("icon created")

      # ── 6. PyInstaller — onedir ────────────────────────────────────────────
      - name: Build with PyInstaller
        run: |
          pyinstaller `
            --name "GameLang" `
            --onedir `
            --windowed `
            --icon "assets/icon.ico" `
            --add-data "core;core" `
            --hidden-import PyQt6.QtWidgets `
            --hidden-import PyQt6.QtCore `
            --hidden-import PyQt6.QtGui `
            --hidden-import anthropic `
            --hidden-import requests `
            --collect-all PyQt6 `
            --clean `
            --noconfirm `
            main.py

      # ── 7. ตรวจสอบว่า build สำเร็จ ────────────────────────────────────────
      - name: Verify build
        run: |
          if (Test-Path "dist/GameLang/GameLang.exe") {
            Write-Host "✓ GameLang.exe พร้อม"
            $size = (Get-Item "dist/GameLang/GameLang.exe").Length / 1MB
            Write-Host "  Size: $([math]::Round($size,1)) MB"
          } else {
            Write-Error "GameLang.exe ไม่พบ — build ล้มเหลว"
            exit 1
          }

      # ── 8. สร้าง LICENSE.txt ───────────────────────────────────────────────
      - name: Create LICENSE
        run: |
          @"
          GameLang Translator v${{ steps.version.outputs.VERSION }}
          Copyright 2024 GameLang
          For personal use with offline/co-op games only.
          "@ | Out-File -FilePath LICENSE.txt -Encoding UTF8

      # ── 9. ติดตั้ง Inno Setup ─────────────────────────────────────────────
      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress
        shell: powershell

      # ── 10. Inject version into ISS ───────────────────────────────────────
      - name: Inject version into ISS
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          (Get-Content installer/gamelang.iss) -replace '#define MyAppVersion\s+"[\d.]+"', "#define MyAppVersion   `"$ver`"" | Set-Content installer/gamelang.iss
          echo "Injected version $ver into gamelang.iss"

      # ── 11. สร้าง Installer ───────────────────────────────────────────────
      - name: Build Installer with Inno Setup
        run: |
          New-Item -ItemType Directory -Force -Path installer_output
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\gamelang.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup ล้มเหลว"
            exit 1
          }
          Write-Host "✓ Installer พร้อม"
          Get-ChildItem installer_output/

      # ── 12. Upload artifacts ──────────────────────────────────────────────
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: GameLang-Installer-Windows
          path: installer_output/GameLang_Translator_v*.exe
          retention-days: 30

      - name: Upload portable .exe
        uses: actions/upload-artifact@v4
        with:
          name: GameLang-Portable-Windows
          path: dist/GameLang/
          retention-days: 30

      # ── 13. Release (เฉพาะตอน push tag v*) ──────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "GameLang Translator v${{ steps.version.outputs.VERSION }}"
          body: |
            ## GameLang Translator v${{ steps.version.outputs.VERSION }}

            ### ติดตั้ง
            ดาวน์โหลด `GameLang_Translator_Setup.exe` แล้วรัน

            ### การอัปเดต
            เปิดแอปเวอร์ชันเก่า → กดปุ่ม **↑ UPDATE** ที่ navbar
          files: |
            installer_output/GameLang_Translator_v${{ steps.version.outputs.VERSION }}_Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
